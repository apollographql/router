schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on ENUM | INPUT_OBJECT | INTERFACE | OBJECT | SCALAR | UNION

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, overrideLabel: String, usedOverridden: Boolean, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on INTERFACE | OBJECT

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments!) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

enum link__Purpose {
  """
  SECURITY features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """EXECUTION features provide metadata necessary for operation execution."""
  EXECUTION
}

scalar link__Import

scalar join__FieldSet

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

enum join__Graph {
  A @join__graph(name: "a", url: "http://a")
  B @join__graph(name: "b", url: "http://b")
}

type Query @join__type(graph: A) @join__type(graph: B) {
  items: [I!]! @join__field(graph: A, type: "[I!]!") @join__field(graph: B, type: "[I!]!")
}

interface I @join__type(graph: A) @join__type(graph: B) {
  id: ID! @join__field(graph: A, type: "ID!") @join__field(graph: B, type: "ID!")
  f: R! @join__field(graph: A, type: "R!") @join__field(graph: B, type: "R!")
}

type P implements I @join__type(graph: A, key: "id") @join__implements(graph: A, interface: "I") {
  id: ID! @join__field(graph: A, type: "ID!")
  f: R! @join__field(graph: A, type: "R!")
}

type R @join__type(graph: A, key: "id") @join__type(graph: B, key: "id", resolvable: false) {
  id: ID! @join__field(graph: A, type: "ID!") @join__field(graph: B, type: "ID!")
  g: G! @join__field(graph: A, type: "G!") @join__field(graph: B, type: "G!")
}

interface G @join__type(graph: A) @join__type(graph: B) {
  id: ID! @join__field(graph: A, type: "ID!") @join__field(graph: B, type: "ID!")
}

type X implements G @join__type(graph: A, key: "id") @join__implements(graph: A, interface: "G") {
  id: ID! @join__field(graph: A, type: "ID!")
  x: Int! @join__field(graph: A, type: "Int!")
}

scalar Import @join__type(graph: A) @join__type(graph: B)

type Q implements I @join__type(graph: B, key: "id") @join__implements(graph: B, interface: "I") {
  id: ID! @join__field(graph: B, type: "ID!")
  f: R! @join__field(graph: B, type: "R!")
}

type Y implements G @join__type(graph: B, key: "id") @join__implements(graph: B, interface: "G") {
  id: ID! @join__field(graph: B, type: "ID!")
  y: Int! @join__field(graph: B, type: "Int!")
}

