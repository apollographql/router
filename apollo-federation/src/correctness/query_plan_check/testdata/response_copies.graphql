# The supergraph for the response-copy tests in `tests/returned_types.rs`, composed with
# `composition::compose` from the five subgraphs below, each of which also links federation v2.3
# importing `@key`, `@shareable`, `@external`, `@requires` and `@provides`. Recompose it when they
# change.
#
# `first` serves a `Parent`'s `child`, and with `second` the list `children`; `children` resolves a
# `Child` by `id` and serves `seed` and `value`; `left` and `right` resolve a `Child` and serve the
# field each is named after.
#
# Subgraph `first`:
#
#   type Query {
#     parent: Parent
#     parents: [Parent]
#     children: [Child] @shareable
#   }
#
#   type Parent {
#     child: Child
#   }
#
#   type Child @key(fields: "id") {
#     id: ID!
#     seed: String @shareable
#     value: String @shareable
#   }
#
# Subgraph `second`:
#
#   type Query {
#     children: [Child] @shareable
#   }
#
#   type Child @key(fields: "id") {
#     id: ID!
#     value: String @shareable
#   }
#
# Subgraph `children`:
#
#   type Child @key(fields: "id") {
#     id: ID!
#     seed: String @shareable
#     value: String @shareable
#   }
#
# Subgraph `left`:
#
#   type Child @key(fields: "id") {
#     id: ID!
#     left: String
#   }
#
# Subgraph `right`:
#
#   type Child @key(fields: "id") {
#     id: ID!
#     right: String
#   }


schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  CHILDREN @join__graph(name: "children", url: "http://children")
  FIRST @join__graph(name: "first", url: "http://first")
  LEFT @join__graph(name: "left", url: "http://left")
  RIGHT @join__graph(name: "right", url: "http://right")
  SECOND @join__graph(name: "second", url: "http://second")
}

scalar join__FieldSet

type Child @join__type(graph: CHILDREN, key: "id") @join__type(graph: FIRST, key: "id") @join__type(graph: LEFT, key: "id") @join__type(graph: RIGHT, key: "id") @join__type(graph: SECOND, key: "id") {
  id: ID!
  seed: String @join__field(graph: CHILDREN) @join__field(graph: FIRST)
  value: String @join__field(graph: CHILDREN) @join__field(graph: FIRST) @join__field(graph: SECOND)
  left: String @join__field(graph: LEFT)
  right: String @join__field(graph: RIGHT)
}

type Query @join__type(graph: CHILDREN) @join__type(graph: FIRST) @join__type(graph: LEFT) @join__type(graph: RIGHT) @join__type(graph: SECOND) {
  parent: Parent @join__field(graph: FIRST)
  parents: [Parent] @join__field(graph: FIRST)
  children: [Child] @join__field(graph: FIRST) @join__field(graph: SECOND)
}

type Parent @join__type(graph: FIRST) {
  child: Child
}
