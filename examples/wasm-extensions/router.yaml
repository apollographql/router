supergraph:
  listen: 127.0.0.1:4100
  introspection: true

headers:
  all:
    request:
      operations:
        - propagate:
            matching: ^x-wasm-

wasm:
  defaults:
    limits:
      execution_timeout: 100ms
      queue_timeout: 25ms
      max_memory_per_instance: 32MiB

  plugins:
    - name: rust-header
      source:
        type: file
        path: examples/wasm-extensions/rust-header/target/wasm32-wasip2/release/router_wasm_rust_header.wasm
      hooks:
        - hook: subgraph.request
          selector:
            service_names: [subgraph-a]
          permissions:
            headers:
              write:
                names: [x-wasm-rust]
            context:
              write:
                names: [wasm.rust]
        - hook: connector.request
          selector:
            service_names: [connectors]
            source_names: [local]
            connector_names: [localMessage]
          permissions:
            headers:
              write:
                names: [x-wasm-rust]
            context:
              write:
                names: [wasm.rust]

    - name: node-header
      source:
        type: file
        path: examples/wasm-extensions/node-header/plugin.wasm
      hooks:
        - hook: supergraph.request
          permissions:
            headers:
              write:
                names: [x-wasm-node]
            context:
              write:
                names: [wasm.node]

    - name: python-header
      source:
        type: file
        path: examples/wasm-extensions/python-header/plugin.wasm
      hooks:
        - hook: supergraph.request
          permissions:
            headers:
              write:
                names: [x-wasm-python]
            context:
              write:
                names: [wasm.python]

    - name: go-header
      source:
        type: file
        path: examples/wasm-extensions/go-header/plugin.wasm
      hooks:
        - hook: supergraph.request
          permissions:
            headers:
              write:
                names: [x-wasm-go]
            context:
              write:
                names: [wasm.go]

    - name: java-header
      source:
        type: file
        path: examples/wasm-extensions/java-header/plugin.wasm
      hooks:
        - hook: supergraph.request
          permissions:
            headers:
              write:
                names: [x-wasm-java]
            context:
              write:
                names: [wasm.java]

    - name: scala-header
      source:
        type: file
        path: examples/wasm-extensions/scala-header/plugin.wasm
      hooks:
        - hook: supergraph.request
          permissions:
            headers:
              write:
                names: [x-wasm-scala]
            context:
              write:
                names: [wasm.scala]
