# `Holder.thing` from two subgraphs: `wide` resolves it, an `X` or a `Y`, and `narrow` declares it
# `@external`, an `X` alone, and resolves it only through the `@provides` on its `holder`, so its
# declaration constrains only its own contribution.
#
# Composed with `apollo_federation::composition::compose` from the two subgraphs below. Recompose it
# when they change.
#
# Subgraph `narrow`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@external", "@provides"])
#
#   type Query {
#     holder: Holder @shareable @provides(fields: "thing { ... on X { x } }")
#   }
#
#   type Holder @key(fields: "id") {
#     id: ID!
#     thing: U @external
#   }
#
#   union U = X
#
#   type X @shareable {
#     x: String @external
#   }
#
# Subgraph `wide`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@external", "@requires", "@provides", "@override", "@interfaceObject"])
#
#   type Query {
#     holder: Holder @shareable
#   }
#
#   type Holder @key(fields: "id") {
#     id: ID!
#     thing: U @shareable
#   }
#
#   union U = X | Y
#
#   type X @shareable {
#     x: String
#   }
#
#   type Y @shareable {
#     y: String
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.4", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  NARROW @join__graph(name: "narrow", url: "http://narrow")
  WIDE @join__graph(name: "wide", url: "http://wide")
}

scalar join__FieldSet

scalar join__DirectiveArguments

type Query @join__type(graph: NARROW) @join__type(graph: WIDE) {
  holder: Holder @join__field(graph: NARROW, provides: "thing { ... on X { x } }") @join__field(graph: WIDE)
}

type Holder @join__type(graph: NARROW, key: "id") @join__type(graph: WIDE, key: "id") {
  id: ID!
  thing: U @join__field(graph: NARROW, external: true) @join__field(graph: WIDE)
}

union U @join__type(graph: NARROW) @join__type(graph: WIDE) @join__unionMember(graph: NARROW, member: "X") @join__unionMember(graph: WIDE, member: "X") @join__unionMember(graph: WIDE, member: "Y") = X | Y

type X @join__type(graph: NARROW) @join__type(graph: WIDE) {
  x: String @join__field(graph: NARROW, external: true) @join__field(graph: WIDE)
}

type Y @join__type(graph: WIDE) {
  y: String
}
