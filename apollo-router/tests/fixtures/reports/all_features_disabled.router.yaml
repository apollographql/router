# Disable distributed apq cache (mising redis definition)
apq:
  router:
    cache:
      in_memory:
        limit: 1000
  subgraph:
    all:
      enabled: true

# Remaining Configuration
include_subgraph_errors:
  all: true
rhai:
  scripts: tests/fixtures
  main: test_callbacks.rhai
demand_control:
  mode: measure
  enabled: false
  strategy:
    static_estimated:
      max: 1500
      list_size: 10
telemetry:
  exporters:
    tracing:
      experimental_response_trace_id:
        enabled: true
        header_name: "my_trace_id"
      common:
        sampler: always_on

  apollo:
    client_name_header: apollographql-client-name
    client_version_header: apollographql-client-version
    endpoint: ENDPOINT
    tracing:
      batch_processor:
        scheduled_delay: 10ms
    metrics:
      otlp:
        batch_processor:
          scheduled_delay: 10ms
      usage_reports:
        batch_processor:
          scheduled_delay: 10ms
    experimental_local_field_metrics: false
    otlp_endpoint: "http://127.0.0.1"
    otlp_tracing_protocol: http
    # Off by default so the usage-reporting tests avoid exporting traces to an unmocked OTLP
    # endpoint (replaces the removed otlp_tracing_sampler). The OTLP trace tests override to always_on.
    sampler: always_off
    field_level_instrumentation_sampler: always_on
    send_headers:
      only:
        - "send-header"
    send_variable_values:
      only:
        - "sendValue"
