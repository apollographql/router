batching:
  enabled: true
  mode: batch_http_link
rhai:
  scripts: tests/fixtures
  main: test_callbacks.rhai
include_subgraph_errors:
  all: true
demand_control:
  mode: measure
  enabled: false
  strategy:
    static_estimated:
      max: 1500
      list_size: 10
telemetry:
  exporters:
    tracing:
      experimental_response_trace_id:
        enabled: true
        header_name: "my_trace_id"
      common:
        sampler: always_on

  apollo:
    client_name_header: apollographql-client-name
    client_version_header: apollographql-client-version
    endpoint: ENDPOINT
    tracing:
      batch_processor:
        scheduled_delay: 10ms
      # The usage-report tests disable Apollo trace export via `sampler: always_off` (below), so
      # this back-stop is only exercised by the OTLP trace tests, which override it to `rate_limited`.
      throttle: representative_traces
    metrics:
      otlp:
        batch_processor:
          scheduled_delay: 10ms
      usage_reports:
        batch_processor:
          scheduled_delay: 10ms
    experimental_local_field_metrics: false
    experimental_otlp_endpoint: "http://127.0.0.1"
    experimental_otlp_tracing_protocol: http
    # Disables Apollo OTLP trace export so the usage-report tests don't hit an unmocked endpoint.
    # The OTLP trace tests override this to `always_on`.
    sampler: always_off
    field_level_instrumentation_sampler: always_on
    send_headers:
      only:
        - "send-header"
    send_variable_values:
      only:
        - "sendValue"
