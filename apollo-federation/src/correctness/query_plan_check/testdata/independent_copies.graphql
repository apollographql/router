# One response key two subgraphs serve, and contributions flattened onto what one of them returned.
#
# `first` and `second` both serve `children: [Child] @shareable`, each with a shareable `value`;
# `left` and `right` resolve a `Child` by `id` and hold `left` and `right`. Two fetches serving
# `children` at the root write one list, whose elements carry what either fetched.
#
# Composed with `apollo_federation::composition::compose` from the 4 subgraphs below. Recompose it
# when they change. `plans/children_left_right.json` is the planner's plan over it, with default
# options, produced by the revision that added the files, for
#
#   { children { left right } }
#
# Subgraph `first`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.8", import: ["@key", "@shareable"])
#
#   type Query {
#     children: [Child] @shareable
#   }
#
#   type Child @key(fields: "id") {
#     id: ID!
#     value: String @shareable
#   }
#
# Subgraph `left`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.8", import: ["@key"])
#
#   type Child @key(fields: "id") {
#     id: ID!
#     left: String
#   }
#
# Subgraph `right`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.8", import: ["@key"])
#
#   type Child @key(fields: "id") {
#     id: ID!
#     right: String
#   }
#
# Subgraph `second`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.8", import: ["@key", "@shareable"])
#
#   type Query {
#     children: [Child] @shareable
#   }
#
#   type Child @key(fields: "id") {
#     id: ID!
#     value: String @shareable
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  FIRST @join__graph(name: "first", url: "http://first")
  LEFT @join__graph(name: "left", url: "http://left")
  RIGHT @join__graph(name: "right", url: "http://right")
  SECOND @join__graph(name: "second", url: "http://second")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

type Query @join__type(graph: FIRST) @join__type(graph: LEFT) @join__type(graph: RIGHT) @join__type(graph: SECOND) {
  children: [Child] @join__field(graph: FIRST) @join__field(graph: SECOND)
}

type Child @join__type(graph: FIRST, key: "id") @join__type(graph: LEFT, key: "id") @join__type(graph: RIGHT, key: "id") @join__type(graph: SECOND, key: "id") {
  id: ID!
  value: String @join__field(graph: FIRST) @join__field(graph: SECOND)
  left: String @join__field(graph: LEFT)
  right: String @join__field(graph: RIGHT)
}
