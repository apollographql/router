# The supergraph for the narrowed-demand tests in `tests/entries.rs`, composed with
# `composition::compose` from the subgraphs below, each of which also links federation v2.3
# importing `@key`, `@external`, `@requires`, `@shareable` and `@interfaceObject`. Recompose it when
# they change.
#
# `gallery`'s `photoCount` demands the `id` of a location's photos alone, its `mediaCount` the `id`
# of every medium, a `Photo` or a `Video`, and its `typedMediaCount` the same through a fragment on
# `Media` itself.
#
# Subgraph `locations`:
#
#   type Query {
#     locations: [Location!]!
#   }
#
#   type Location @key(fields: "id") {
#     id: ID!
#     media: [Media!]!
#   }
#
#   interface Media {
#     id: ID!
#   }
#
#   type Photo implements Media @key(fields: "id") {
#     id: ID!
#   }
#
#   type Video implements Media @key(fields: "id") {
#     id: ID!
#   }
#
# Subgraph `gallery`:
#
#   type Location @key(fields: "id") {
#     id: ID!
#     media: [Media!]! @external
#     "Requires the `id` of the photos alone."
#     photoCount: Int @requires(fields: "media { ... on Photo { id } }")
#     "Requires the `id` of every medium."
#     mediaCount: Int @requires(fields: "media { id }")
#     "Requires the `id` of every medium, through a fragment on `Media`."
#     typedMediaCount: Int @requires(fields: "media { ... on Media { id } }")
#   }
#
#   interface Media {
#     id: ID!
#   }
#
#   type Photo implements Media @key(fields: "id") {
#     id: ID!
#   }
#
#   type Video implements Media @key(fields: "id") {
#     id: ID!
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  GALLERY @join__graph(name: "gallery", url: "none")
  LOCATIONS @join__graph(name: "locations", url: "none")
}

scalar join__FieldSet

type Location @join__type(graph: GALLERY, key: "id") @join__type(graph: LOCATIONS, key: "id") {
  id: ID!
  media: [Media!]! @join__field(graph: GALLERY, external: true) @join__field(graph: LOCATIONS)
  """Requires the `id` of the photos alone."""
  photoCount: Int @join__field(graph: GALLERY, requires: "media { ... on Photo { id } }")
  """Requires the `id` of every medium."""
  mediaCount: Int @join__field(graph: GALLERY, requires: "media { id }")
  """Requires the `id` of every medium, through a fragment on `Media`."""
  typedMediaCount: Int @join__field(graph: GALLERY, requires: "media { ... on Media { id } }")
}

interface Media @join__type(graph: GALLERY) @join__type(graph: LOCATIONS) {
  id: ID!
}

type Photo implements Media @join__implements(graph: GALLERY, interface: "Media") @join__implements(graph: LOCATIONS, interface: "Media") @join__type(graph: GALLERY, key: "id") @join__type(graph: LOCATIONS, key: "id") {
  id: ID!
}

type Video implements Media @join__implements(graph: GALLERY, interface: "Media") @join__implements(graph: LOCATIONS, interface: "Media") @join__type(graph: GALLERY, key: "id") @join__type(graph: LOCATIONS, key: "id") {
  id: ID!
}

type Query @join__type(graph: GALLERY) @join__type(graph: LOCATIONS) {
  locations: [Location!]! @join__field(graph: LOCATIONS)
}
