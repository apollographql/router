telemetry:
  exporters:
    tracing:
      common:
        service_name: router
      otlp:
        enabled: true
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}
        batch_processor:
          scheduled_delay: 1s
          max_queue_size: 1
          max_concurrent_exports: 1
          max_export_batch_size: 1
    metrics:
      prometheus:
        enabled: true
