# The supergraph for the nearest-setter tests in `tests/context_arguments.rs`, composed with
# `composition::compose` from the subgraphs below, each prefixed with `extend schema
# @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@shareable", "@context",
# "@fromContext"])`. Recompose it when they change.
#
# `Query.shop` holds a `Shop`, its `section` a `Section`, its `product` a `Product`, and its `item`
# an `Item`. `catalog` serves them all; `pricing` resolves shops, sections and items by `id`, where
# `Shop` and `Section` set the context `shop`, and `Item.price` and `Section.label` take `currency`
# from it. `context_nearest_setter_shop_only.graphql` is the same with `Shop` alone setting it.
#
# Subgraph `catalog`:
#
#   type Query {
#     shop: Shop
#   }
#
#   type Shop @key(fields: "id") {
#     id: ID!
#     currency: String @shareable
#     section: Section @shareable
#   }
#
#   type Section @key(fields: "id") {
#     id: ID!
#     currency: String @shareable
#     product: Product @shareable
#   }
#
#   type Product @shareable {
#     id: ID
#     item: Item
#   }
#
#   type Item @key(fields: "id") {
#     id: ID!
#   }
#
# Subgraph `pricing`:
#
#   type Shop @key(fields: "id") @context(name: "shop") {
#     id: ID!
#     currency: String @shareable
#     section: Section @shareable
#   }
#
#   type Section @key(fields: "id") @context(name: "shop") {
#     id: ID!
#     currency: String @shareable
#     product: Product @shareable
#     label(currency: String @fromContext(field: "$shop { currency }")): String
#   }
#
#   type Product @shareable {
#     id: ID
#     item: Item
#   }
#
#   type Item @key(fields: "id") {
#     id: ID!
#     price(currency: String @fromContext(field: "$shop { currency }")): String
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) @link(url: "https://specs.apollo.dev/context/v0.1", for: SECURITY) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @context(name: String!) repeatable on INTERFACE | OBJECT | UNION

directive @context__fromContext(field: context__ContextFieldValue) on ARGUMENT_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "http://catalog")
  PRICING @join__graph(name: "pricing", url: "http://pricing")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar context__ContextFieldValue

type Query @join__type(graph: CATALOG) @join__type(graph: PRICING) {
  shop: Shop @join__field(graph: CATALOG)
}

type Shop @join__type(graph: CATALOG, key: "id") @join__type(graph: PRICING, key: "id") @context(name: "pricing__shop") {
  id: ID!
  currency: String
  section: Section
}

type Section @join__type(graph: CATALOG, key: "id") @join__type(graph: PRICING, key: "id") @context(name: "pricing__shop") {
  id: ID!
  currency: String
  product: Product
  label: String @join__field(graph: PRICING, contextArguments: [{context: "pricing__shop", name: "currency", type: "String", selection: "{ currency }"}])
}

type Product @join__type(graph: CATALOG) @join__type(graph: PRICING) {
  id: ID
  item: Item
}

type Item @join__type(graph: CATALOG, key: "id") @join__type(graph: PRICING, key: "id") {
  id: ID!
  price: String @join__field(graph: PRICING, contextArguments: [{context: "pricing__shop", name: "currency", type: "String", selection: "{ currency }"}])
}
