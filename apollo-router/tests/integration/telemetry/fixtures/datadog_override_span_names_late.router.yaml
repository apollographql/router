telemetry:
  exporters:
    tracing:
      response_trace_id:
        enabled: true
        header_name: apollo-custom-trace-id
        format: datadog
      common:
        service_name: router
        preview_datadog_agent_sampling: true
      datadog:
        enabled: true
        # Span mapping will always override the span name as far as the test agent is concerned
        enable_span_mapping: false
        batch_processor:
          scheduled_delay: 100ms
  instrumentation:
    spans:
      router:
        attributes:
          otel.name:
            operation_name: string


