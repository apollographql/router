schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  A @join__graph(name: "a", url: "http://a")
  B @join__graph(name: "b", url: "http://b")
  C @join__graph(name: "c", url: "http://c")
  D @join__graph(name: "d", url: "http://d")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

type Query @join__type(graph: A) @join__type(graph: B) @join__type(graph: C) @join__type(graph: D) {
  user: User @join__field(graph: A)
  product: Product @join__field(graph: A)
  itemById(id: ID!): Item @join__field(graph: A)
  a: A @join__field(graph: A)
  productInB: Product @join__field(graph: B)
}

# `profile` is a key hop from a to either b or c, and both hops cost one
# fetch, so the one-step score is a tie that greedy tie breaking commits to
# b. `detail` only exists in c, so landing on b forces a second hop, b -> c.
# Only exploring both branches to completion shows c was the cheaper choice.
type User @join__type(graph: A, key: "id") @join__type(graph: B, key: "id") @join__type(graph: C, key: "id") {
  id: ID!
  name: String @join__field(graph: A)
  nickname: String @join__field(graph: A, override: "b")
  handle: String @join__field(graph: A, override: "b", overrideLabel: "test") @join__field(graph: B, overrideLabel: "test")
  email: String @join__field(graph: B)
  profile: Profile @join__field(graph: B) @join__field(graph: C)
}

type Product @join__type(graph: A, key: "id") @join__type(graph: B, key: "id") {
  id: ID!
  weight: Float @join__field(graph: A) @join__field(graph: B, external: true)
  shippingCost: Float @join__field(graph: B, requires: "weight")
}

# a owns collection and is the entry point, b owns syndicatedTitle, c owns
# corpusTitle and requires resolvedUrl, and d owns resolvedUrl. d's preview
# requires parts that are external in d and live in a, b, and c, and c's
# part itself has a @requires. Resolving each external part through a
# different subgraph moves the anchor between entity groups, so a nested
# condition must not be appended to whichever group was visited last.
type Item @join__type(graph: A, key: "id") @join__type(graph: B, key: "id") @join__type(graph: C, key: "id") @join__type(graph: D, key: "id") {
  id: ID!
  collection: String @join__field(graph: A) @join__field(graph: D, external: true)
  syndicatedTitle: String @join__field(graph: B) @join__field(graph: D, external: true)
  resolvedUrl: String @join__field(graph: C, external: true) @join__field(graph: D)
  corpusTitle: String @join__field(graph: C, requires: "resolvedUrl") @join__field(graph: D, external: true)
  preview: String @join__field(graph: D, requires: "syndicatedTitle collection corpusTitle")
}

type A @join__type(graph: A, key: "id") @join__type(graph: B, key: "id") @join__type(graph: C, key: "id") {
  id: ID!
  s: S @join__field(graph: A) @join__field(graph: C, external: true)
  j: J @join__field(graph: B) @join__field(graph: C, external: true)
  c: C @join__field(graph: C)
}

type S @join__type(graph: A) @join__type(graph: C) {
  status: String @join__field(graph: A) @join__field(graph: C, external: true)
}

type Profile @join__type(graph: B, key: "id") @join__type(graph: C, key: "id") {
  id: ID!
  detail: String @join__field(graph: C)
}

type J @join__type(graph: B) @join__type(graph: C) {
  m: Int @join__field(graph: B) @join__field(graph: C, external: true)
}

type C @join__type(graph: C, key: "id") {
  id: ID!
  elig: Boolean @join__field(graph: C, requires: "a { s { status } j { m } }")
  a: A
}

