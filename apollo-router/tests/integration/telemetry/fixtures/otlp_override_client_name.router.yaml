rhai:
  scripts: "tests/integration/telemetry/fixtures"
  main: "override_client_name.rhai"
telemetry:
  instrumentation:
    events:
      router:
        request: info
        response: info
        error: info
  exporters:
    tracing:
      common:
        service_name: router
      otlp:
        enabled: true
        protocol: http
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}
        batch_processor:
          scheduled_delay: 10ms
    metrics:
      common:
        service_name: router
      otlp:
        enabled: true
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}/metrics
        protocol: http
        batch_processor:
          scheduled_delay: 10ms
