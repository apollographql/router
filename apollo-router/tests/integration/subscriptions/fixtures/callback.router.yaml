supergraph:
  path: /
  introspection: true
homepage:
  enabled: false
sandbox:
  enabled: true
override_subgraph_url:
  accounts: http://localhost:{{SUBGRAPH_PORT}}
include_subgraph_errors:
  all: true
subscription:
  enabled: true
  mode:
    callback:
      public_url: "http://localhost:{{CALLBACK_RECEIVER_PORT}}/callback"
      # The tests never call this listener. Let the router pick its port: a port
      # chosen in advance can be taken by another process before the router binds it.
      listen: "127.0.0.1:0"
      path: "/callback" 
      heartbeat_interval: 5s
      subgraphs: ["accounts"]
headers:
  all:
    request:
      operations:
        - propagate:
            named: custom_id