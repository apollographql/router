# The world of the planner's `conditional_requires_sharing_a_fetch_with_an_unconditional_sibling`,
# extended for the conditional `requires` controls: `Subgraph1` serves `T`, whose `id` keys it,
# with what the requiring fields read, and `Subgraph2` resolves a `T` from `id` and requires its
# inputs: `b` requires `a`, `d` `e`, `both` `u { left right }`, `onLeft` and `onRight` one child of
# `u` each, the `for…` fields `media` under three readings of its interface, and `forParts` a
# `Photo`'s `a` and a `Video`'s `b`. `I` is an interface `T` implements in `Subgraph1` alone, for
# an entry written at it; `V` has two keys, `id` and `id2`, and `W` three, two of them composite,
# `org { id }` and `team { id }`; `t` takes a `String` argument, for an operation that declares a
# variable other than a `Boolean`.
#
# Composed with `apollo_federation::composition::compose` from the two subgraphs below. Recompose
# it when they change.
#
# Subgraph `Subgraph1`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@external", "@requires"])
#
#   type Query {
#     t(s: String): T
#     v: V
#     w: W
#   }
#
#   interface I {
#     id: ID!
#     a: Int
#   }
#
#   type T implements I @key(fields: "id") {
#     id: ID!
#     a: Int
#     e: Int
#     u: U
#     media: [Media]
#   }
#
#   interface Media {
#     id: ID!
#   }
#
#   type Photo implements Media {
#     id: ID!
#     a: X
#   }
#
#   type Video implements Media {
#     id: ID!
#     b: X
#   }
#
#   type X {
#     x: Int
#   }
#
#   type U {
#     left: Int
#     right: Int
#   }
#
#   type V @key(fields: "id") @key(fields: "id2") {
#     id: ID!
#     id2: ID!
#   }
#
#   type W @key(fields: "org { id }") @key(fields: "team { id }") @key(fields: "id2") {
#     org: Org
#     team: Team
#     id2: ID!
#   }
#
#   type Org @shareable {
#     id: ID!
#   }
#
#   type Team @shareable {
#     id: ID!
#   }
#
# Subgraph `Subgraph2`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@external", "@requires"])
#
#   type T @key(fields: "id") {
#     id: ID!
#     a: Int @external
#     e: Int @external
#     u: U @external
#     b: Int @requires(fields: "a")
#     c: Int
#     d: Int @requires(fields: "e")
#     both: Int @requires(fields: "u { left right }")
#     onLeft: Int @requires(fields: "u { left }")
#     onRight: Int @requires(fields: "u { right }")
#     media: [Media] @external
#     forPhotos: Int @requires(fields: "media { ... on Photo { id } }")
#     forMedia: Int @requires(fields: "media { ... on Media { id } }")
#     forAll: Int @requires(fields: "media { id }")
#     forParts: Int @requires(fields: "media { ... on Photo { a { x } } ... on Video { b { x } } }")
#   }
#
#   interface Media {
#     id: ID!
#   }
#
#   type Photo implements Media {
#     id: ID! @external
#     a: X @external
#   }
#
#   type Video implements Media {
#     id: ID! @external
#     b: X @external
#   }
#
#   type X {
#     x: Int @external
#   }
#
#   type U {
#     left: Int @external
#     right: Int @external
#   }
#
#   type V @key(fields: "id") @key(fields: "id2") {
#     id: ID!
#     id2: ID!
#     c: Int
#   }
#
#   type W @key(fields: "org { id }") @key(fields: "team { id }") @key(fields: "id2") {
#     org: Org
#     team: Team
#     id2: ID!
#     c: Int
#   }
#
#   type Org @shareable {
#     id: ID!
#   }
#
#   type Team @shareable {
#     id: ID!
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.4", for: EXECUTION) {
