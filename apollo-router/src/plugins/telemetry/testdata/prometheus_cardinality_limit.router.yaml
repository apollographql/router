telemetry:
  apollo:
    client_name_header: name_header
    client_version_header: version_header
  exporters:
    metrics:
      common:
        service_name: apollo-router
        cardinality_limit: 5000
        views:
          - name: apollo.test.histo
            cardinality_limit: 10000
            allowed_attribute_keys:
              - otel_scope_name
      prometheus:
        enabled: true
