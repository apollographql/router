# The supergraph for the entry-condition and representation tests in `tests/entries.rs`, composed
# with `composition::compose` from the subgraphs below, each of which also links federation v2.3
# importing `@key`, `@external`, `@requires`, `@shareable` and `@interfaceObject`. Recompose it when
# they change.
#
# `second` resolves a `T` by `id`: `b` requires `a`, `d` requires `e`, `both` requires
# `u { left right }`, and `c` requires nothing.
#
# Subgraph `first`:
#
#   type Query {
#     t: T
#   }
#
#   interface I {
#     a: Int
#   }
#
#   type T implements I @key(fields: "id") {
#     id: ID!
#     a: Int
#     e: Int
#     u: U
#   }
#
#   type U @shareable {
#     left: Int
#     right: Int
#   }
#
# Subgraph `second`:
#
#   type T @key(fields: "id") {
#     id: ID!
#     a: Int @external
#     e: Int @external
#     u: U @external
#     b: Int @requires(fields: "a")
#     c: Int
#     d: Int @requires(fields: "e")
#     both: Int @requires(fields: "u { left right }")
#   }
#
#   type U @shareable {
#     left: Int
#     right: Int
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  FIRST @join__graph(name: "first", url: "none")
  SECOND @join__graph(name: "second", url: "none")
}

scalar join__FieldSet

type Query @join__type(graph: FIRST) @join__type(graph: SECOND) {
  t: T @join__field(graph: FIRST)
}

interface I @join__type(graph: FIRST) {
  a: Int
}

type T implements I @join__implements(graph: FIRST, interface: "I") @join__type(graph: FIRST, key: "id") @join__type(graph: SECOND, key: "id") {
  id: ID!
  a: Int @join__field(graph: FIRST) @join__field(graph: SECOND, external: true)
  e: Int @join__field(graph: FIRST) @join__field(graph: SECOND, external: true)
  u: U @join__field(graph: FIRST) @join__field(graph: SECOND, external: true)
  b: Int @join__field(graph: SECOND, requires: "a")
  c: Int @join__field(graph: SECOND)
  d: Int @join__field(graph: SECOND, requires: "e")
  both: Int @join__field(graph: SECOND, requires: "u { left right }")
}

type U @join__type(graph: FIRST) @join__type(graph: SECOND) {
  left: Int
  right: Int
}
