# The supergraph for the union contextual-argument tests in `tests/context_arguments.rs`,
# composed with `composition::compose` from the three subgraphs below, each prefixed with
# `extend schema @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key",
# "@shareable", "@context", "@fromContext"])`. Recompose it when they change.
#
# `Outlet` is a union of `Store` and `Department`. `stores` sets `locality` on both members, and
# its `Offer.label` takes `locale` from it; `badges` declares `locality` on the union itself, and
# its `Offer.badge` takes the outlet's `__typename`, all a union can select directly.
#
# Subgraph `directory`:
#
#   type Query {
#     outlets: [Outlet]
#   }
#
#   union Outlet = Store | Department
#
#   type Store @shareable {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Department @shareable {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Offer @key(fields: "id") {
#     id: ID!
#   }
#
# Subgraph `stores`:
#
#   type Store @shareable @context(name: "locality") {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Department @shareable @context(name: "locality") {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Offer @key(fields: "id") {
#     id: ID!
#     label(locale: String @fromContext(field: "$locality { locale }")): String
#   }
#
# Subgraph `badges`:
#
#   union Outlet @context(name: "locality") = Store | Department
#
#   type Store @shareable {
#     offers: [Offer]
#   }
#
#   type Department @shareable {
#     offers: [Offer]
#   }
#
#   type Offer @key(fields: "id") {
#     id: ID!
#     badge(kind: String @fromContext(field: "$locality { __typename }")): String
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) @link(url: "https://specs.apollo.dev/context/v0.1", for: SECURITY) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @context(name: String!) repeatable on INTERFACE | OBJECT | UNION

directive @context__fromContext(field: context__ContextFieldValue) on ARGUMENT_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  BADGES @join__graph(name: "badges", url: "none")
  DIRECTORY @join__graph(name: "directory", url: "none")
  STORES @join__graph(name: "stores", url: "none")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar context__ContextFieldValue

union Outlet @join__type(graph: BADGES) @join__type(graph: DIRECTORY) @join__unionMember(graph: BADGES, member: "Store") @join__unionMember(graph: DIRECTORY, member: "Store") @join__unionMember(graph: BADGES, member: "Department") @join__unionMember(graph: DIRECTORY, member: "Department") @context(name: "badges__locality") = Store | Department

type Store @join__type(graph: BADGES) @join__type(graph: DIRECTORY) @join__type(graph: STORES) @context(name: "stores__locality") {
  offers: [Offer]
  locale: String @join__field(graph: DIRECTORY) @join__field(graph: STORES)
  currency: String @join__field(graph: DIRECTORY) @join__field(graph: STORES)
}

type Department @join__type(graph: BADGES) @join__type(graph: DIRECTORY) @join__type(graph: STORES) @context(name: "stores__locality") {
  offers: [Offer]
  locale: String @join__field(graph: DIRECTORY) @join__field(graph: STORES)
  currency: String @join__field(graph: DIRECTORY) @join__field(graph: STORES)
}

type Offer @join__type(graph: BADGES, key: "id") @join__type(graph: DIRECTORY, key: "id") @join__type(graph: STORES, key: "id") {
  id: ID!
  badge: String @join__field(graph: BADGES, contextArguments: [{context: "badges__locality", name: "kind", type: "String", selection: "{ __typename }"}])
  label: String @join__field(graph: STORES, contextArguments: [{context: "stores__locality", name: "locale", type: "String", selection: "{ locale }"}])
}

type Query @join__type(graph: BADGES) @join__type(graph: DIRECTORY) @join__type(graph: STORES) {
  outlets: [Outlet] @join__field(graph: DIRECTORY)
}

