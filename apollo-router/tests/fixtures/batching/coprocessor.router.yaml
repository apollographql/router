# Simple config to enable batching and a coprocessor for testing killed requests

batching:
  enabled: true
  mode: batch_http_link
  subgraph:
    all:
      enabled: true

coprocessor:
  url: ${env.TEST_CONFIG_COPROCESSOR_URL}
  subgraph:
    all:
      request:
        service_name: true
        body: true

include_subgraph_errors:
  all: true
