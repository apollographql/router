schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/cost/v0.1") {
  query: Query
}

directive @cost(
  weight: Int!
) on ARGUMENT_DEFINITION | ENUM | FIELD_DEFINITION | INPUT_FIELD_DEFINITION | OBJECT | SCALAR

directive @join__directive(
  graphs: [join__Graph!]
  name: String!
  args: join__DirectiveArguments
) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
  overrideLabel: String
  contextArguments: [join__ContextArgument!]
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(
  graph: join__Graph!
  interface: String!
) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(
  graph: join__Graph!
  member: String!
) repeatable on UNION

directive @link(
  url: String
  as: String
  for: link__Purpose
  import: [link__Import]
) repeatable on SCHEMA

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

scalar join__FieldSet

scalar join__FieldValue

enum join__Graph {
  SUBGRAPH
    @join__graph(name: "subgraph", url: "http://localhost:4001")
}

scalar link__Import

enum link__Purpose {
  SECURITY
  EXECUTION
}

type Query @join__type(graph: SUBGRAPH) {
  fieldWithNegativeArgCost(discount: Int @cost(weight: -20)): String
    @join__field(graph: SUBGRAPH)
    @cost(weight: 5)
  fieldWithExactZeroCost(offset: Int @cost(weight: -10)): String
    @join__field(graph: SUBGRAPH)
    @cost(weight: 10)
  fieldWithPartialNegativeArg(offset: Int @cost(weight: -3)): String
    @join__field(graph: SUBGRAPH)
    @cost(weight: 10)
  fieldWithMixedArgs(a: Int @cost(weight: -30), b: Int @cost(weight: 5)): String
    @join__field(graph: SUBGRAPH)
    @cost(weight: 10)
  objectWithNegativeArgCost(discount: Int @cost(weight: -50)): NegCostObject
    @join__field(graph: SUBGRAPH)
    @cost(weight: 5)
  nestedObjectWithNegativeArgCost(discount: Int @cost(weight: -50)): NegCostObject
    @join__field(graph: SUBGRAPH)
    @cost(weight: 5)
}

type NegCostObject @join__type(graph: SUBGRAPH) {
  id: ID
  name: String
  inner: InnerObject
}

type InnerObject @join__type(graph: SUBGRAPH) {
  value: String
}
