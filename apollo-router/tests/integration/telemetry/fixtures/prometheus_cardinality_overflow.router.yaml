telemetry:
  instrumentation:
    instruments:
      default_requirement_level: required
      router:
        http.server.request.duration:
          attributes:
            server.port: false
            server.address: false
            http.response.status_code:
              alias: status
  exporters:
    metrics:
      prometheus:
        enabled: true
        path: /metrics
      common:
        views:
          # A successful and a failed request are enough to overflow this limit
          - name: http.server.request.duration
            cardinality_limit: 1
