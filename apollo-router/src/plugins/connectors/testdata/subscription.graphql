schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.6", for: EXECUTION) @link(url: "https://specs.apollo.dev/connect/v0.5", for: EXECUTION) @join__directive(name: "link", graphs: [STREAMS], args: {url: "https://specs.apollo.dev/connect/v0.5", import: ["@connect", "@source"]}) @join__directive(name: "source", graphs: [STREAMS], args: {name: "market", http: {baseURL: "http://market"}}) {
  query: Query
  subscription: Subscription
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  STREAMS @join__graph(name: "streams", url: "http://streams")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

type Query @join__type(graph: STREAMS) {
  price(symbol: String!): Price @join__directive(name: "connect", graphs: [STREAMS], args: {source: "market", http: {GET: "/prices/{$args.symbol}"}, selection: "symbol amount"})
}

type Subscription @join__type(graph: STREAMS) {
  prices(symbol: String!): Price @join__directive(name: "connect", graphs: [STREAMS], args: {source: "market", http: {GET: "/stream/{$args.symbol}"}, selection: "symbol amount"})
  quotes(symbol: String!): Price @join__directive(name: "connect", graphs: [STREAMS], args: {source: "market", http: {GET: "/quotes/{$args.symbol}"}, selection: "$.quote { symbol amount }"})
  history(symbol: String!): [Price] @join__directive(name: "connect", graphs: [STREAMS], args: {source: "market", http: {GET: "/stream/{$args.symbol}", stream: "array"}, selection: "symbol amount"})
  checked(symbol: String!): Price @join__directive(name: "connect", graphs: [STREAMS], args: {source: "market", http: {GET: "/stream/{$args.symbol}"}, selection: "symbol amount: amount->match([0, @->withError('Zero price')], [@, @])"})
}

type Price @join__type(graph: STREAMS) {
  symbol: String!
  amount: Float
}
