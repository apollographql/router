# The supergraph for the input-renamer tests in `tests/entries.rs`, composed with
# `composition::compose` from the subgraphs below, each of which also links federation v2.3
# importing `@key`, `@external`, `@requires`, `@shareable` and `@interfaceObject`. Recompose it when
# they change.
#
# `reviews` resolves a `Book` and a `Film` by `id`, their `blurb` requiring `isbn`; `notes` declares
# `Item` an interface object, its `note` requiring `isbn` at `Item`.
#
# Subgraph `catalog`:
#
#   type Query {
#     feed: [Item!]!
#   }
#
#   interface Item @key(fields: "id") {
#     id: ID!
#     isbn: String!
#   }
#
#   type Book implements Item @key(fields: "id") {
#     id: ID!
#     isbn: String!
#     title: String!
#   }
#
#   type Film implements Item @key(fields: "id") {
#     id: ID!
#     isbn: String!
#     title: String!
#   }
#
# Subgraph `notes`:
#
#   type Item @key(fields: "id") @interfaceObject {
#     id: ID!
#     isbn: String! @external
#     note: String! @requires(fields: "isbn")
#   }
#
# Subgraph `reviews`:
#
#   type Book @key(fields: "id") {
#     id: ID!
#     isbn: String! @external
#     blurb: String! @requires(fields: "isbn")
#   }
#
#   type Film @key(fields: "id") {
#     id: ID!
#     isbn: String! @external
#     blurb: String! @requires(fields: "isbn")
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "none")
  NOTES @join__graph(name: "notes", url: "none")
  REVIEWS @join__graph(name: "reviews", url: "none")
}

scalar join__FieldSet

type Query @join__type(graph: CATALOG) @join__type(graph: NOTES) @join__type(graph: REVIEWS) {
  feed: [Item!]! @join__field(graph: CATALOG)
}

interface Item @join__type(graph: CATALOG, key: "id") @join__type(graph: NOTES, key: "id", isInterfaceObject: true) {
  id: ID!
  isbn: String! @join__field(graph: CATALOG) @join__field(graph: NOTES, external: true)
  note: String! @join__field(graph: NOTES, requires: "isbn")
}

type Book implements Item @join__implements(graph: CATALOG, interface: "Item") @join__type(graph: CATALOG, key: "id") @join__type(graph: REVIEWS, key: "id") {
  id: ID!
  isbn: String! @join__field(graph: CATALOG) @join__field(graph: REVIEWS, external: true)
  title: String! @join__field(graph: CATALOG)
  blurb: String! @join__field(graph: REVIEWS, requires: "isbn")
  note: String! @join__field
}

type Film implements Item @join__implements(graph: CATALOG, interface: "Item") @join__type(graph: CATALOG, key: "id") @join__type(graph: REVIEWS, key: "id") {
  id: ID!
  isbn: String! @join__field(graph: CATALOG) @join__field(graph: REVIEWS, external: true)
  title: String! @join__field(graph: CATALOG)
  blurb: String! @join__field(graph: REVIEWS, requires: "isbn")
  note: String! @join__field
}
