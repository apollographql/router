# The supergraph for the producer-type tests in `tests/returned_types.rs`, composed with
# `composition::compose` from the four subgraphs below, each of which also links federation v2.3
# importing `@key`, `@shareable`, `@external`, `@requires` and `@provides`. Recompose it when they
# change.
#
# `empty` serves `thing`, a `Named`, and declares no implementation of it; `items` declares `Item`
# but serves no `thing`, since composition rejects a shared field whose sharers have no runtime
# type in common. `catalog` and `promos` share `sections`, a list of `Section`; `catalog` declares
# `Hero` alone and `promos` `Promo` too, which composition only hints at.
#
# Subgraph `empty`:
#
#   type Query {
#     thing: Named
#     ping: String
#   }
#
#   interface Named {
#     id: ID
#   }
#
# Subgraph `items`:
#
#   interface Named {
#     id: ID
#   }
#
#   type Item implements Named {
#     id: ID
#   }
#
# Subgraph `catalog`:
#
#   type Query {
#     sections: [Section] @shareable
#   }
#
#   interface Section {
#     name: String
#   }
#
#   type Hero implements Section @shareable {
#     name: String
#     title: String
#   }
#
# Subgraph `promos`:
#
#   type Query {
#     sections: [Section] @shareable
#   }
#
#   interface Section {
#     name: String
#   }
#
#   type Hero implements Section @shareable {
#     name: String
#     title: String
#   }
#
#   type Promo implements Section {
#     name: String
#     blurb: String
#   }


schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "http://catalog")
  EMPTY @join__graph(name: "empty", url: "http://empty")
  ITEMS @join__graph(name: "items", url: "http://items")
  PROMOS @join__graph(name: "promos", url: "http://promos")
}

scalar join__FieldSet

type Query @join__type(graph: CATALOG) @join__type(graph: EMPTY) @join__type(graph: ITEMS) @join__type(graph: PROMOS) {
  sections: [Section] @join__field(graph: CATALOG) @join__field(graph: PROMOS)
  thing: Named @join__field(graph: EMPTY)
  ping: String @join__field(graph: EMPTY)
}

interface Section @join__type(graph: CATALOG) @join__type(graph: PROMOS) {
  name: String
}

type Hero implements Section @join__implements(graph: CATALOG, interface: "Section") @join__implements(graph: PROMOS, interface: "Section") @join__type(graph: CATALOG) @join__type(graph: PROMOS) {
  name: String
  title: String
}

interface Named @join__type(graph: EMPTY) @join__type(graph: ITEMS) {
  id: ID
}

type Item implements Named @join__implements(graph: ITEMS, interface: "Named") @join__type(graph: ITEMS) {
  id: ID
}

type Promo implements Section @join__implements(graph: PROMOS, interface: "Section") @join__type(graph: PROMOS) {
  name: String
  blurb: String
}
