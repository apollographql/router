description: Custom histogram stream_duration
events:
  - - router_request:
        uri: "/"
        method: POST
        body: |
          {"query":"{ primary ... @defer { deferred } }"}
    - supergraph_request:
        uri: "/"
        method: POST
        headers:
          accept: multipart/mixed; deferSpec=20220824
        query: "{ primary ... @defer { deferred } }"
    - graphql_response:
        data:
          primary: "ready"
    - graphql_response:
        data:
          deferred: "late"
    - supergraph_stream_end
    - supergraph_response:
        status: 200
        data:
          primary: "ready"
    - router_response:
        body: |
          {"data":{"primary":"ready"}}
        status: 200
