supergraph:
  listen: 127.0.0.1:4000
  introspection: true
sandbox:
  enabled: true
homepage:
  enabled: false
include_subgraph_errors:
  all: true # Propagate errors from all subgraphs

response_cache:
  enabled: true
  debug: true # exposes cache key details in the request context
  subgraph:
    all:
      enabled: true
      redis:
        urls: ["redis://localhost:6379"]
        ttl: 24h # Optional, by default no expiration

coprocessor:
  url: http://127.0.0.1:3000 # mandatory URL which is the address of the coprocessor
  supergraph:
    response:
      context: all
  subgraph:
    all:
      response:
        context: all
