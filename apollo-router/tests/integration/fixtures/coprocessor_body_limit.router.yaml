# This coprocessor doesn't point to anything
coprocessor:
  url: "<replace>"
  router:
    request:
      body: true
limits:
  http_max_request_bytes: 100

traffic_shaping:
  router:
    timeout: 1s

telemetry:
  exporters:
    metrics:
      prometheus:
        enabled: true
        listen: "127.0.0.1:0"
        path: "/metrics"