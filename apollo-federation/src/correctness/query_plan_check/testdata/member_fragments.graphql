# A field selected once per member of a union above it, at a copy whose type is an interface:
# `root` is an `Outer`, the union of `O1` to `O32`, each `O` holds a `leaf`, a `Leaf`, and `Leaf`
# is implemented by `L1` to `L16`, each with its `v` and a `next` that is a `Leaf` again. A fetch
# selecting `leaf { v }` under each member's fragment writes one `leaf` copy, whose `v` it
# supplies under each member it selected and each implementation the copy can be.
#
