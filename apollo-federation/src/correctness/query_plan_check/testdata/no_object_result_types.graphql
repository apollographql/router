# A field with no possible object result types in its producer's subgraph.
#
# `a` serves `thing`, a `Named`, which `a` declares with no implementation, so `thing` has no
# possible object result types in `a`. `b` declares `Named`'s one implementation, `Item`, keyed by
# `id`, and serves it as `item`. The supergraph's `Named` has `Item`, so `thing` read at the
# supergraph owes `Item`'s fields below it, which no fetch from `a` can supply, and read in its
# producer's subgraph owes nothing below it.
#
# Composed with `apollo_federation::composition::compose` from the two subgraphs below. Recompose it
# when they change. The plans beside it in `plans/` are the planner's plans over it, with default
# options, produced by the revision that added the files:
#
#   thing_name.json
#     { thing { name } }
#   thing_item_id.json
#     { thing { ... on Item { id } } }
#
# Subgraph `a`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
#
#   type Query {
#     thing: Named
#   }
#
#   interface Named {
#     name: String
#   }
#
# Subgraph `b`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
#
#   type Query {
#     item: Item
#   }
#
#   interface Named {
#     name: String
#   }
#
#   type Item implements Named @key(fields: "id") {
#     id: ID!
#     name: String
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  A @join__graph(name: "a", url: "http://a")
  B @join__graph(name: "b", url: "http://b")
}

scalar join__FieldSet

type Query @join__type(graph: A) @join__type(graph: B) {
  thing: Named @join__field(graph: A)
  item: Item @join__field(graph: B)
}

interface Named @join__type(graph: A) @join__type(graph: B) {
  name: String
}

type Item implements Named @join__implements(graph: B, interface: "Named") @join__type(graph: B, key: "id") {
  id: ID!
  name: String
}
