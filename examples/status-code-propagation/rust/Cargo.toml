[package]
name = "propagate-status-code"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1"
apollo-router = { path = "../../../apollo-router", features = ["mock_subgraphs_testing"] }
async-trait = "0.1"
http = "1.2"
schemars = { version = "1.0.0", features = ["url2"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }

[dev-dependencies]
tower-test = "0.4.0"
