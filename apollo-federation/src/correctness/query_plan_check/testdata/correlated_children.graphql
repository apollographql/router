# A parent whose runtime type decides its child's: in `source`, an `A`'s `child` is an `X` and a
# `B`'s a `Y`, where `wide` declares either a `Choice`. `consumer` resolves an `X`'s or a `Y`'s
# `score` from its `value`.
#
# Composed with `apollo_federation::composition::compose` from the three subgraphs below. Recompose
# it when they change.
#
# Subgraph `consumer`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@external", "@requires", "@provides", "@override", "@interfaceObject"])
#
#   type X @key(fields: "id") {
#     id: ID!
#     value: String @external
#     score: Int @requires(fields: "value")
#   }
#
#   type Y @key(fields: "id") {
#     id: ID!
#     value: String @external
#     score: Int @requires(fields: "value")
#   }
#
# Subgraph `source`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@external", "@requires", "@provides", "@override", "@interfaceObject"])
#
#   type Query {
#     parent: Parent @shareable
#   }
#
#   interface Parent {
#     child: Choice
#   }
#
#   type A implements Parent @key(fields: "id") {
#     id: ID!
#     child: X @shareable
#   }
#
#   type B implements Parent @key(fields: "id") {
#     id: ID!
#     child: Y @shareable
#   }
#
#   union Choice = X | Y
#
#   type X @key(fields: "id") {
#     id: ID!
#     value: String @shareable
#     other: String @shareable
#   }
#
#   type Y @key(fields: "id") {
#     id: ID!
#     value: String @shareable
#     other: String @shareable
#   }
#
# Subgraph `wide`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@external", "@requires", "@provides", "@override", "@interfaceObject"])
#
#   type A @key(fields: "id") {
#     id: ID!
#     child: Choice @shareable
#   }
#
#   type B @key(fields: "id") {
#     id: ID!
#     child: Choice @shareable
#   }
#
#   union Choice = X | Y
#
#   type X @key(fields: "id") {
#     id: ID!
#   }
#
#   type Y @key(fields: "id") {
#     id: ID!
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.4", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  CONSUMER @join__graph(name: "consumer", url: "http://consumer")
  SOURCE @join__graph(name: "source", url: "http://source")
  WIDE @join__graph(name: "wide", url: "http://wide")
}

scalar join__FieldSet

scalar join__DirectiveArguments

type X @join__type(graph: CONSUMER, key: "id") @join__type(graph: SOURCE, key: "id") @join__type(graph: WIDE, key: "id") {
  id: ID!
  value: String @join__field(graph: CONSUMER, external: true) @join__field(graph: SOURCE)
  score: Int @join__field(graph: CONSUMER, requires: "value")
  other: String @join__field(graph: SOURCE)
}

type Y @join__type(graph: CONSUMER, key: "id") @join__type(graph: SOURCE, key: "id") @join__type(graph: WIDE, key: "id") {
  id: ID!
  value: String @join__field(graph: CONSUMER, external: true) @join__field(graph: SOURCE)
  score: Int @join__field(graph: CONSUMER, requires: "value")
  other: String @join__field(graph: SOURCE)
}

type Query @join__type(graph: CONSUMER) @join__type(graph: SOURCE) @join__type(graph: WIDE) {
  parent: Parent @join__field(graph: SOURCE)
}

interface Parent @join__type(graph: SOURCE) {
  child: Choice
}

type A implements Parent @join__implements(graph: SOURCE, interface: "Parent") @join__type(graph: SOURCE, key: "id") @join__type(graph: WIDE, key: "id") {
  id: ID!
  child: Choice @join__field(graph: SOURCE, type: "X") @join__field(graph: WIDE, type: "Choice")
}

type B implements Parent @join__implements(graph: SOURCE, interface: "Parent") @join__type(graph: SOURCE, key: "id") @join__type(graph: WIDE, key: "id") {
  id: ID!
  child: Choice @join__field(graph: SOURCE, type: "Y") @join__field(graph: WIDE, type: "Choice")
}

union Choice @join__type(graph: SOURCE) @join__type(graph: WIDE) @join__unionMember(graph: SOURCE, member: "X") @join__unionMember(graph: WIDE, member: "X") @join__unionMember(graph: SOURCE, member: "Y") @join__unionMember(graph: WIDE, member: "Y") = X | Y
