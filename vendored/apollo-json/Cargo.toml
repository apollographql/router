# TEMPORARY (ROUTER-2044): vendored from
# https://github.com/apollographql/apollo-platform-rs @ 478083bf
# (branch agent/RR-1055, crate apollo-json/crates/apollo-json) so remote CI can
# build the router without access to that repository.
#
# Do not edit here; change the source crate and re-vendor.
#
# This copy carries local changes that must land upstream before the next
# re-vendor: the apollo-errors 0.8.1 bump, the member-scan cursor in
# document.rs, in-arena container growth, merge_from absorbing a uniquely
# held source, PendingTree (pending.rs, with ValueBuilder::set_pending),
# Value::serialize_into with the serializer's inline frame stack, the
# x86_64 SSE2/AVX2 string scanner with string_scanner() (simd.rs), and
# escape_into finding escapes with that scanner (text.rs).
#
# apollo-errors must be the same version the router links through
# apollo-configuration and apollo-qos. Each version declares its own linkme
# ERROR_REGISTRY, and with two linked every registry read panics.
[package]
name = "apollo-json"
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
repository = "https://github.com/apollographql/apollo-platform-rs"
description = "Arena-backed JSON document model with structural sharing and zero-copy pass-through serialization"
publish = false

# Standalone: keeps the vendored crate out of the router workspace's fmt and
# lint rules. CI runs its tests in a separate step of the CircleCI test job,
# against the Cargo.lock beside this manifest.
[workspace]

[dependencies]
ahash = "0.8.12"
apollo-errors = "0.8.1"
bytes = "1.0"
# Number formatting into a stack buffer. These are the same crates serde_json
# formats through, so the text matches byte for byte, without its per-number
# String allocation.
itoa = "1.0"
memchr = "2.8"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simdutf8 = "0.1.5"
# `preserve_order` matches how the router consumes the legacy type; key order
# is load-bearing for byte-identical serialization.
serde_json_bytes = { version = "0.2.5", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1.11"
# The property tests diff serializer output against a serde_json reference
# model; without `float_roundtrip` serde_json's float parsing is off by up
# to 1 ulp and the comparison reports phantom divergences.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
