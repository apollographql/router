telemetry:
  exporters:
    tracing:
      response_trace_id:
        enabled: true
        header_name: apollo-custom-trace-id
      common:
        service_name: router
        parent_based_sampler: false
      otlp:
        enabled: true
        protocol: http
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}/traces
        batch_processor:
          scheduled_delay: 10ms
    metrics:
      common:
        service_name: router
      otlp:
        enabled: true
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}/metrics
        protocol: http
        batch_processor:
          scheduled_delay: 10ms

