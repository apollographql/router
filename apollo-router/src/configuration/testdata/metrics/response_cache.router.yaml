response_cache:
  enabled: true
  debug: true
  invalidation:
    listen: 127.0.0.1:4000
    path: /invalidation
  subgraph:
    all:
      redis:
        urls: ["redis://test"]
        required_to_start: true
      enabled: true
      invalidation:
        enabled: true
        shared_key: "invalidate"
    subgraphs:
      accounts:
        enabled: false
      products:
        ttl: 120s
        invalidation:
          enabled: true
          shared_key: "invalidate"
  # Redis configured but `enabled` omitted: connector caching defaults on (None means
  # enabled), so the usage metric must key on Redis presence, not `enabled`, to read true here.
  connector:
    all:
      redis:
        urls: ["redis://test"]
      ttl: 60s
