schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.2", for: EXECUTION)
{
  query: Query
}

directive @join__field(graph: join__Graph!, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar join__FieldSet

enum join__Graph {
  H @join__graph(name: "h", url: "http://h")
  S1 @join__graph(name: "s1", url: "http://s1")
  S2 @join__graph(name: "s2", url: "http://s2")
}

scalar link__Import

enum link__Purpose {
  SECURITY
  EXECUTION
}

type Query
  @join__type(graph: H)
  @join__type(graph: S1)
  @join__type(graph: S2)
{
  a: A @join__field(graph: S1)
}

type A
  @join__type(graph: H, key: "id")
  @join__type(graph: S1, key: "id")
  @join__type(graph: S2, key: "id")
{
  id: ID!
  s: S @join__field(graph: S1) @join__field(graph: H, external: true)
  j: J @join__field(graph: S2) @join__field(graph: H, external: true)
  c: C @join__field(graph: H)
}

type S
  @join__type(graph: S1)
  @join__type(graph: H)
{
  status: String @join__field(graph: S1) @join__field(graph: H, external: true)
}

type J
  @join__type(graph: S2)
  @join__type(graph: H)
{
  m: Int @join__field(graph: S2) @join__field(graph: H, external: true)
}

type C
  @join__type(graph: H, key: "id")
{
  id: ID!
  elig: Boolean @join__field(graph: H, requires: "a { s { status } j { m } }")
  a: A @join__field(graph: H)
}
