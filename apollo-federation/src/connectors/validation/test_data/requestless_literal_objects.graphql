extend schema
  @link(
    url: "https://specs.apollo.dev/connect/v0.4"
    import: ["@connect", "@source"]
  )

# Requestless `@connect` directives whose selections read no fields of
# `$root`. None of these should trigger `RequestlessSelectionUsesRequestData`:
#
# - `Query.featuredProduct`: JSON object literal with a nested object.
# - `Query.featuredProductRelaxed`: same, without quotes or commas.
# - `Query.featuredProductWrapped`: same, wrapped in `$(...)`.
# - `Query.nestedAlias`: top-level alias whose value is an object literal
#   (`price: { ... }`, with a colon), which does not descend into
#   `$root.price`.
# - `Query.nestedArgs`: nested object literal that reads `$args`.
# - `Query.nestedArgsJson`: same, in JSON syntax.
# - `Query.nestedConfig`: nested object literal that reads `$config`.
type Price {
  amount: Int
  currencyCode: String
}

type Product {
  id: ID!
  name: String
  price: Price
}

type Query {
  featuredProduct: Product
    @connect(
      selection: """
      {
        "id": "sku-4417",
        "name": "Aeron Chair",
        "price": { "amount": 1395, "currencyCode": "USD" }
      }
      """
    )

  featuredProductRelaxed: Product
    @connect(
      selection: """
      {
        id: "sku-4417"
        name: "Aeron Chair"
        price: { amount: 1395 currencyCode: "USD" }
      }
      """
    )

  featuredProductWrapped: Product
    @connect(
      selection: """
      $({
        "id": "sku-4417",
        "name": "Aeron Chair",
        "price": { "amount": 1395, "currencyCode": "USD" }
      })
      """
    )

  nestedAlias: Product
    @connect(
      selection: """
      id: "sku-4417"
      price: { amount: 1395 currencyCode: "USD" }
      """
    )

  nestedArgs(amount: Int): Product
    @connect(
      selection: """
      id: "sku-4417"
      price: { amount: $args.amount currencyCode: "USD" }
      """
    )

  nestedArgsJson(amount: Int): Product
    @connect(
      selection: """
      { "id": "sku-4417", "price": { "amount": $args.amount, "currencyCode": "USD" } }
      """
    )

  nestedConfig: Product
    @connect(
      selection: """
      id: "sku-4417"
      price: { amount: 1395 currencyCode: $config.currency }
      """
    )
}
