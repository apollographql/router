# Copy of `otlp.router.yaml` with the tracing batch processor's scheduled delay pushed far out
# of the way, so that a span buffered by the processor can only reach the collector via the
# flush performed when the tracer provider is shut down at exit.
telemetry:
  exporters:
    tracing:
      common:
        service_name: router
      otlp:
        enabled: true
        protocol: http
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}
        batch_processor:
          scheduled_delay: 10min
    metrics:
      common:
        service_name: router
      otlp:
        enabled: true
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}/metrics
        protocol: http
        batch_processor:
          scheduled_delay: 10ms
