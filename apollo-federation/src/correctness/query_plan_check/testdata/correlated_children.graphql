# The supergraph for the correlated-children tests in `tests/returned_types.rs`, composed with
# `composition::compose` from the two subgraphs below, each of which also links federation v2.3
# importing `@key`, `@shareable`, `@external`, `@requires` and `@provides`. Recompose it when they
# change.
#
# A `Parent` is an `A` or a `B`, each with a `child` of type `Choice`, an `X` or a `Y`. `source`
# declares an `A`'s child an `X` and a `B`'s a `Y`; `wide` declares both a `Choice`, which is what
# the supergraph keeps.
#
# Subgraph `source`:
#
#   type Query {
#     parent: Parent @shareable
#   }
#
#   interface Parent {
#     child: Choice
#   }
#
#   type A implements Parent @shareable {
#     child: X
#   }
#
#   type B implements Parent @shareable {
#     child: Y
#   }
#
#   union Choice = X | Y
#
#   type X @shareable {
#     value: String
#     other: String
#   }
#
#   type Y @shareable {
#     value: String
#     other: String
#   }
#
# Subgraph `wide`:
#
#   type Query {
#     parent: Parent @shareable
#   }
#
#   interface Parent {
#     child: Choice
#   }
#
#   type A implements Parent @shareable {
#     child: Choice
#   }
#
#   type B implements Parent @shareable {
#     child: Choice
#   }
#
#   union Choice = X | Y
#
#   type X @shareable {
#     value: String
#     other: String
#   }
#
#   type Y @shareable {
#     value: String
#     other: String
#   }


schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  SOURCE @join__graph(name: "source", url: "http://source")
  WIDE @join__graph(name: "wide", url: "http://wide")
}

scalar join__FieldSet

type Query @join__type(graph: SOURCE) @join__type(graph: WIDE) {
  parent: Parent
}

interface Parent @join__type(graph: SOURCE) @join__type(graph: WIDE) {
  child: Choice
}

type A implements Parent @join__implements(graph: SOURCE, interface: "Parent") @join__implements(graph: WIDE, interface: "Parent") @join__type(graph: SOURCE) @join__type(graph: WIDE) {
  child: Choice @join__field(graph: SOURCE, type: "X") @join__field(graph: WIDE, type: "Choice")
}

type B implements Parent @join__implements(graph: SOURCE, interface: "Parent") @join__implements(graph: WIDE, interface: "Parent") @join__type(graph: SOURCE) @join__type(graph: WIDE) {
  child: Choice @join__field(graph: SOURCE, type: "Y") @join__field(graph: WIDE, type: "Choice")
}

union Choice @join__type(graph: SOURCE) @join__type(graph: WIDE) @join__unionMember(graph: SOURCE, member: "X") @join__unionMember(graph: WIDE, member: "X") @join__unionMember(graph: SOURCE, member: "Y") @join__unionMember(graph: WIDE, member: "Y") = X | Y

type X @join__type(graph: SOURCE) @join__type(graph: WIDE) {
  value: String
  other: String
}

type Y @join__type(graph: SOURCE) @join__type(graph: WIDE) {
  value: String
  other: String
}
