telemetry:
  exporters:
    tracing:
      response_trace_id:
        enabled: true
        header_name: apollo-custom-trace-id
      common:
        service_name: router
        resource:
          env: local1
      otlp:
        enabled: true
        protocol: http
        endpoint: ${env.TEST_CONFIG_COLLECTOR_ENDPOINT}
        batch_processor:
          scheduled_delay: 10ms
          max_export_batch_size: 512

  instrumentation:
    spans:
      supergraph:
        attributes:
          graphql.operation.name: true