# A fragment on an interface an object implements in the supergraph and not in the subgraph a fetch
# is sent to.
#
# `source` serves `item`, a `Choice` that is an `A` or a `B`, with `A` implementing `I` and `B` not;
# `other` declares `B` implementing `I` too, so the supergraph's `I` has both. A fetch's fragments
# are read in its own subgraph, where `... on I` selects nothing on a `B`.
#
# Composed with `apollo_federation::composition::compose` from the two subgraphs below. Recompose it
# when they change. `plans/item_i_value.json` is the planner's plan over it, with default options,
# produced by the revision that added the files, for
#
#   { item { ... on I { value } } }
#
# Subgraph `other`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.8", import: ["@shareable"])
#
#   type Query {
#     others: [I]
#   }
#
#   interface I {
#     value: String
#   }
#
#   type A implements I @shareable {
#     value: String
#   }
#
#   type B implements I @shareable {
#     value: String
#   }
#
# Subgraph `source`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.8", import: ["@shareable"])
#
#   type Query {
#     item: Choice
#   }
#
#   union Choice = A | B
#
#   interface I {
#     value: String
#   }
#
#   type A implements I @shareable {
#     value: String
#   }
#
#   type B @shareable {
#     value: String
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  OTHER @join__graph(name: "other", url: "http://other")
  SOURCE @join__graph(name: "source", url: "http://source")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

type Query @join__type(graph: OTHER) @join__type(graph: SOURCE) {
  others: [I] @join__field(graph: OTHER)
  item: Choice @join__field(graph: SOURCE)
}

interface I @join__type(graph: OTHER) @join__type(graph: SOURCE) {
  value: String
}

type A implements I @join__implements(graph: OTHER, interface: "I") @join__implements(graph: SOURCE, interface: "I") @join__type(graph: OTHER) @join__type(graph: SOURCE) {
  value: String
}

type B implements I @join__implements(graph: OTHER, interface: "I") @join__type(graph: OTHER) @join__type(graph: SOURCE) {
  value: String
}

union Choice @join__type(graph: SOURCE) @join__unionMember(graph: SOURCE, member: "A") @join__unionMember(graph: SOURCE, member: "B") = A | B
