# The supergraph for the contextual-argument tests in `tests/context_arguments.rs`, composed with
# `composition::compose` from the three subgraphs below, each prefixed with
# `extend schema @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key",
# "@shareable", "@context", "@fromContext"])`. Recompose it when they change.
#
# `directory` serves the hierarchy: regions holding stores, each store holding departments, and
# outlets, each a store or a department. `stores` resolves an `Offer` by `id`; `Store` and
# `Department` set the context `locality`, `Offer.label` takes `locale` from it, and `Offer.price`
# takes `locale` and `currency`. `outlets` declares `locality` on the interface `Outlet` instead,
# and its `Offer.tag` takes `locale` from it. `Region` sets no context.
#
# Subgraph `directory`:
#
#   type Query {
#     regions: [Region] @shareable
#     outlets: [Outlet]
#   }
#
#   type Region @shareable {
#     locale: String
#     stores: [Store]
#   }
#
#   interface Outlet {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Store implements Outlet @shareable {
#     id: ID
#     locale: String
#     currency: String
#     offers: [Offer]
#     departments: [Department]
#   }
#
#   type Department implements Outlet @shareable {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Offer @key(fields: "id") {
#     id: ID!
#   }
#
# Subgraph `stores`:
#
#   type Query {
#     regions: [Region] @shareable
#   }
#
#   type Region @shareable {
#     stores: [Store]
#   }
#
#   interface Outlet {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Store implements Outlet @shareable @context(name: "locality") {
#     id: ID
#     locale: String
#     currency: String
#     offers: [Offer]
#     departments: [Department]
#   }
#
#   type Department implements Outlet @shareable @context(name: "locality") {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Offer @key(fields: "id") {
#     id: ID!
#     label(locale: String @fromContext(field: "$locality { locale }"), format: String): String
#     price(
#       locale: String @fromContext(field: "$locality { locale }")
#       currency: String @fromContext(field: "$locality { currency }")
#     ): String
#   }
#
# Subgraph `outlets`:
#
#   interface Outlet @context(name: "locality") {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Store implements Outlet @shareable {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Department implements Outlet @shareable {
#     locale: String
#     currency: String
#     offers: [Offer]
#   }
#
#   type Offer @key(fields: "id") {
#     id: ID!
#     tag(locale: String @fromContext(field: "$locality { locale }")): String
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) @link(url: "https://specs.apollo.dev/context/v0.1", for: SECURITY) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @context(name: String!) repeatable on INTERFACE | OBJECT | UNION

directive @context__fromContext(field: context__ContextFieldValue) on ARGUMENT_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  DIRECTORY @join__graph(name: "directory", url: "none")
  OUTLETS @join__graph(name: "outlets", url: "none")
  STORES @join__graph(name: "stores", url: "none")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar context__ContextFieldValue

type Query @join__type(graph: DIRECTORY) @join__type(graph: OUTLETS) @join__type(graph: STORES) {
  regions: [Region] @join__field(graph: DIRECTORY) @join__field(graph: STORES)
  outlets: [Outlet] @join__field(graph: DIRECTORY)
}

type Region @join__type(graph: DIRECTORY) @join__type(graph: STORES) {
  locale: String @join__field(graph: DIRECTORY)
  stores: [Store]
}

interface Outlet @join__type(graph: DIRECTORY) @join__type(graph: OUTLETS) @join__type(graph: STORES) @context(name: "outlets__locality") {
  locale: String
  currency: String
  offers: [Offer]
}

type Store implements Outlet @join__implements(graph: DIRECTORY, interface: "Outlet") @join__implements(graph: OUTLETS, interface: "Outlet") @join__implements(graph: STORES, interface: "Outlet") @join__type(graph: DIRECTORY) @join__type(graph: OUTLETS) @join__type(graph: STORES) @context(name: "stores__locality") {
  id: ID @join__field(graph: DIRECTORY) @join__field(graph: STORES)
  locale: String
  currency: String
  offers: [Offer]
  departments: [Department] @join__field(graph: DIRECTORY) @join__field(graph: STORES)
}

type Department implements Outlet @join__implements(graph: DIRECTORY, interface: "Outlet") @join__implements(graph: OUTLETS, interface: "Outlet") @join__implements(graph: STORES, interface: "Outlet") @join__type(graph: DIRECTORY) @join__type(graph: OUTLETS) @join__type(graph: STORES) @context(name: "stores__locality") {
  locale: String
  currency: String
  offers: [Offer]
}

type Offer @join__type(graph: DIRECTORY, key: "id") @join__type(graph: OUTLETS, key: "id") @join__type(graph: STORES, key: "id") {
  id: ID!
  tag: String @join__field(graph: OUTLETS, contextArguments: [{context: "outlets__locality", name: "locale", type: "String", selection: "{ locale }"}])
  label(format: String): String @join__field(graph: STORES, contextArguments: [{context: "stores__locality", name: "locale", type: "String", selection: "{ locale }"}])
  price: String @join__field(graph: STORES, contextArguments: [{context: "stores__locality", name: "locale", type: "String", selection: "{ locale }"}, {context: "stores__locality", name: "currency", type: "String", selection: "{ currency }"}])
}

