# The supergraph for the input-rewrite and entry-condition tests in `tests/input_rewrites.rs`,
# composed with `composition::compose` from the three subgraphs below. Recompose it when they
# change.
#
# The model's `ConditionalRequires` fixture: `one` serves `t` and what the entries read; `two`
# resolves a `T` by `id`, and its `b`, `d` and `both` require `a`, `e` and `u { left right }`;
# `projection` is the model's `projectionSubgraphs`, whose `b` and `d` require `u { right }` and
# `u { left }`.
#
# Subgraph `one`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
#
#   type Query {
#     t: T
#   }
#
#   type T @key(fields: "id") {
#     id: ID!
#     a: Int
#     e: Int
#     u: U
#   }
#
#   type U @shareable {
#     left: Int
#     right: Int
#   }
#
# Subgraph `two`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@external", "@requires", "@shareable"])
#
#   type T @key(fields: "id") {
#     id: ID!
#     a: Int @external
#     e: Int @external
#     u: U @external
#     b: Int @requires(fields: "a") @shareable
#     c: Int
#     d: Int @requires(fields: "e") @shareable
#     both: Int @requires(fields: "u { left right }")
#   }
#
#   type U @shareable {
#     left: Int
#     right: Int
#   }
#
# Subgraph `projection`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@external", "@requires", "@shareable"])
#
#   type T @key(fields: "id") {
#     id: ID!
#     u: U @external
#     b: Int @requires(fields: "u { right }") @shareable
#     d: Int @requires(fields: "u { left }") @shareable
#   }
#
#   type U @shareable {
#     left: Int
#     right: Int
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  ONE @join__graph(name: "one", url: "http://one")
  PROJECTION @join__graph(name: "projection", url: "http://projection")
  TWO @join__graph(name: "two", url: "http://two")
}

scalar join__FieldSet

type Query @join__type(graph: ONE) @join__type(graph: PROJECTION) @join__type(graph: TWO) {
  t: T @join__field(graph: ONE)
}

type T @join__type(graph: ONE, key: "id") @join__type(graph: PROJECTION, key: "id") @join__type(graph: TWO, key: "id") {
  id: ID!
  a: Int @join__field(graph: ONE) @join__field(graph: TWO, external: true)
  e: Int @join__field(graph: ONE) @join__field(graph: TWO, external: true)
  u: U @join__field(graph: ONE) @join__field(graph: PROJECTION, external: true) @join__field(graph: TWO, external: true)
  b: Int @join__field(graph: PROJECTION, requires: "u { right }") @join__field(graph: TWO, requires: "a")
  d: Int @join__field(graph: PROJECTION, requires: "u { left }") @join__field(graph: TWO, requires: "e")
  c: Int @join__field(graph: TWO)
  both: Int @join__field(graph: TWO, requires: "u { left right }")
}

type U @join__type(graph: ONE) @join__type(graph: PROJECTION) @join__type(graph: TWO) {
  left: Int
  right: Int
}
