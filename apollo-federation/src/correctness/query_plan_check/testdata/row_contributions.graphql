# The supergraph for the row-contribution tests in `tests/returned_types.rs`, composed with
# `composition::compose` from the four subgraphs below, each of which also links federation v2.9
# importing `@key`, `@shareable`, `@external`, `@requires`, `@provides`, `@context` and
# `@fromContext`. Recompose it when they change.
#
# `rows` serves a list of `I`, each an `A` or a `B`; `a` and `b` each declare one of them, resolve
# it by `id` and serve its `datum`; `consumer` serves `result` on both, requiring `datum`, and a
# row's `cell`, whose `contextual` takes `datum` from the row, which sets the context `row`.
#
# Subgraph `rows`:
#
#   type Query {
#     rows: [I]
#   }
#
#   interface I {
#     id: ID!
#   }
#
#   type A implements I @key(fields: "id") {
#     id: ID!
#   }
#
#   type B implements I @key(fields: "id") {
#     id: ID!
#   }
#
# Subgraph `a`:
#
#   interface I {
#     id: ID!
#   }
#
#   type A implements I @key(fields: "id") {
#     id: ID!
#     datum: String
#   }
#
# Subgraph `b`:
#
#   interface I {
#     id: ID!
#   }
#
#   type B implements I @key(fields: "id") {
#     id: ID!
#     datum: String
#   }
#
# Subgraph `consumer`:
#
#   interface I @context(name: "row") {
#     id: ID!
#     datum: String
#     result: String
#     cell: Cell
#   }
#
#   type A implements I @key(fields: "id") {
#     id: ID!
#     datum: String @external
#     result: String @requires(fields: "datum")
#     cell: Cell
#   }
#
#   type B implements I @key(fields: "id") {
#     id: ID!
#     datum: String @external
#     result: String @requires(fields: "datum")
#     cell: Cell
#   }
#
#   type Cell @key(fields: "id") {
#     id: ID!
#     contextual(input: String @fromContext(field: "$row { datum }")): String
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) @link(url: "https://specs.apollo.dev/context/v0.1", for: SECURITY) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @context(name: String!) repeatable on INTERFACE | OBJECT | UNION

directive @context__fromContext(field: context__ContextFieldValue) on ARGUMENT_DEFINITION

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  A @join__graph(name: "a", url: "none")
  B @join__graph(name: "b", url: "none")
  CONSUMER @join__graph(name: "consumer", url: "none")
  ROWS @join__graph(name: "rows", url: "none")
}

scalar join__FieldSet

scalar join__DirectiveArguments

scalar join__FieldValue

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar context__ContextFieldValue

interface I @join__type(graph: A) @join__type(graph: B) @join__type(graph: CONSUMER) @join__type(graph: ROWS) @context(name: "consumer__row") {
  id: ID!
  datum: String @join__field(graph: CONSUMER)
  result: String @join__field(graph: CONSUMER)
  cell: Cell @join__field(graph: CONSUMER)
}

type A implements I @join__implements(graph: A, interface: "I") @join__implements(graph: CONSUMER, interface: "I") @join__implements(graph: ROWS, interface: "I") @join__type(graph: A, key: "id") @join__type(graph: CONSUMER, key: "id") @join__type(graph: ROWS, key: "id") {
  id: ID!
  datum: String @join__field(graph: A) @join__field(graph: CONSUMER, external: true)
  result: String @join__field(graph: CONSUMER, requires: "datum")
  cell: Cell @join__field(graph: CONSUMER)
}

type Query @join__type(graph: A) @join__type(graph: B) @join__type(graph: CONSUMER) @join__type(graph: ROWS) {
  rows: [I] @join__field(graph: ROWS)
}

type B implements I @join__implements(graph: B, interface: "I") @join__implements(graph: CONSUMER, interface: "I") @join__implements(graph: ROWS, interface: "I") @join__type(graph: B, key: "id") @join__type(graph: CONSUMER, key: "id") @join__type(graph: ROWS, key: "id") {
  id: ID!
  datum: String @join__field(graph: B) @join__field(graph: CONSUMER, external: true)
  result: String @join__field(graph: CONSUMER, requires: "datum")
  cell: Cell @join__field(graph: CONSUMER)
}

type Cell @join__type(graph: CONSUMER, key: "id") {
  id: ID!
  contextual: String @join__field(graph: CONSUMER, contextArguments: [{context: "consumer__row", name: "input", type: "String", selection: "{ datum }"}])
}

