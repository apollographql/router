# Rows of two kinds one subgraph produces and two subgraphs with narrower declarations contribute
# to, the conformance world `enrichment-keeps-rows` of the `federation-bench` toolkit.
#
# `catalog` declares `interface Item` with two keyed implementations, `Book` and `Disc`, and serves
# `items: [Item]`; `pricing` declares `Item` with `Book` alone and holds `Book.price`; `stock` holds
# `Disc.units` and knows no `Book`. A contribution's narrower declarations restrict what it adds,
# never the rows the producer mounted.
#
# Composed with `apollo_federation::composition::compose` from the three subgraphs below, the
# toolkit world's sources. Recompose it when they change. The plans beside it in `plans/` are the
# planner's plans over it, with default options, produced by the revision that added the files:
#
#   items_both_kinds.json
#     query BothKinds { items { id name ... on Book { price } ... on Disc { units } } }
#   items_book_price.json
#     query BookEnrichment { items { id name ... on Book { price } } }
#   items_disc_units.json
#     query DiscEnrichment { items { id name ... on Disc { units } } }
#
# Subgraph `catalog`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])
#
#   interface Item {
#     id: ID!
#     name: String
#   }
#
#   type Book implements Item @key(fields: "id") {
#     id: ID!
#     name: String
#   }
#
#   type Disc implements Item @key(fields: "id") {
#     id: ID!
#     name: String
#   }
#
#   type Query {
#     items: [Item]
#   }
#
# Subgraph `pricing`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])
#
#   interface Item {
#     id: ID!
#   }
#
#   type Book implements Item @key(fields: "id") {
#     id: ID!
#     price: Int
#   }
#
# Subgraph `stock`:
#
#   extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])
#
#   type Disc @key(fields: "id") {
#     id: ID!
#     units: Int
#   }

schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar link__Import

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "http://catalog")
  PRICING @join__graph(name: "pricing", url: "http://pricing")
  STOCK @join__graph(name: "stock", url: "http://stock")
}

scalar join__FieldSet

interface Item @join__type(graph: CATALOG) @join__type(graph: PRICING) {
  id: ID!
  name: String @join__field(graph: CATALOG)
}

type Book implements Item @join__implements(graph: CATALOG, interface: "Item") @join__implements(graph: PRICING, interface: "Item") @join__type(graph: CATALOG, key: "id") @join__type(graph: PRICING, key: "id") {
  id: ID!
  name: String @join__field(graph: CATALOG)
  price: Int @join__field(graph: PRICING)
}

type Disc implements Item @join__implements(graph: CATALOG, interface: "Item") @join__type(graph: CATALOG, key: "id") @join__type(graph: STOCK, key: "id") {
  id: ID!
  name: String @join__field(graph: CATALOG)
  units: Int @join__field(graph: STOCK)
}

type Query @join__type(graph: CATALOG) @join__type(graph: PRICING) @join__type(graph: STOCK) {
  items: [Item] @join__field(graph: CATALOG)
}
