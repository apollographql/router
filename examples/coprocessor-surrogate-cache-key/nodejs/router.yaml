supergraph:
  listen: 127.0.0.1:4000
  introspection: true
sandbox:
  enabled: true
homepage:
  enabled: false
include_subgraph_errors:
  all: true # Propagate errors from all subraphs

coprocessor:
  url: http://127.0.0.1:3000 # mandatory URL which is the address of the coprocessor
  supergraph:
    response:
      context: all
  subgraph:
    all:
      response:
        subgraph_request_id: true
        context: all
