schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.2", for: EXECUTION)
{
  query: Query
}

directive @join__field(graph: join__Graph!, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar join__FieldSet

enum join__Graph {
  A @join__graph(name: "a", url: "http://a")
  B @join__graph(name: "b", url: "http://b")
  C @join__graph(name: "c", url: "http://c")
}

scalar link__Import

enum link__Purpose {
  SECURITY
  EXECUTION
}

type Query
  @join__type(graph: A)
{
  user: User @join__field(graph: A)
}

# `profile` is a key hop from A to either B or C — both hops cost the same
# one fetch, so the one-step score at this decision is a tie. Greedy tie
# breaking (declaration order) commits to B first.
type User
  @join__type(graph: A, key: "id")
  @join__type(graph: B, key: "id")
  @join__type(graph: C, key: "id")
{
  id: ID!
  profile: Profile @join__field(graph: B) @join__field(graph: C)
}

# `detail` only exists in C. Landing on B (the greedy choice above) forces a
# SECOND hop, B -> C, to resolve it: three fetches total. Landing on C
# directly resolves `detail` for free in the same fetch: two fetches total.
# The one-step score at the `profile` decision can't see this second hop, so
# only exploring both branches to completion (a later BULB discrepancy
# iteration) reveals that C was the cheaper choice all along.
type Profile
  @join__type(graph: B, key: "id")
  @join__type(graph: C, key: "id")
{
  id: ID!
  detail: String @join__field(graph: C)
}
