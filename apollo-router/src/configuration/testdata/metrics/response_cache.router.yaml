response_cache:
  enabled: true
  debug: true
  invalidation:
    listen: 127.0.0.1:4000
    path: /invalidation
  subgraph:
    all:
      redis:
        urls: ["redis://test"]
        required_to_start: true
      enabled: true
      invalidation:
        enabled: true
        shared_key: "invalidate"
    subgraphs:
      accounts:
        enabled: false
      products:
        ttl: 120s
        invalidation:
          enabled: true
          shared_key: "invalidate"
  # Redis configured but `enabled` omitted: connector caching defaults on (a missing flag means
  # enabled), so the usage metric reads true here — it keys on storage being present AND the
  # feature not being explicitly disabled (`enabled != false`), which covers the omitted case.
  connector:
    all:
      redis:
        urls: ["redis://test"]
      ttl: 60s
      cache_key_headers: []
